<style>
/* Layout: one big task card at a time, custom keypad below, 100-dot progress map on top */
:root{
  --bg:#f3f6fb; --card:#ffffff; --fg:#1d2540; --muted:#6b7593; --line:#dde3ef;
  --accent:#3b5bdb; --ok:#1f9d55; --ok-soft:#d8f5e3; --bad:#d6336c; --bad-soft:#fde2ea;
  --key:#e9eef8; --key-fg:#1d2540;
  --display:"Baloo 2","Nunito",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12162a; --card:#1b2140; --fg:#eef1fb; --muted:#97a0c0; --line:#2b3358;
  --accent:#7d97ff; --ok:#45d483; --ok-soft:#163a2a; --bad:#ff6b95; --bad-soft:#47192a;
  --key:#262e55; --key-fg:#eef1fb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12162a; --card:#1b2140; --fg:#eef1fb; --muted:#97a0c0; --line:#2b3358;
  --accent:#7d97ff; --ok:#45d483; --ok-soft:#163a2a; --bad:#ff6b95; --bad-soft:#47192a;
  --key:#262e55; --key-fg:#eef1fb; color-scheme:dark}
html,body{height:100%}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{touch-action:manipulation}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:14px 20px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
header .right{display:flex;align-items:center;gap:10px}
.menu-btn{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--fg);cursor:pointer;padding:0}
.menu-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font-family:var(--display);font-weight:800;font-size:1.35rem;margin:0}
.count{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.dot{aspect-ratio:1;border-radius:50%;background:var(--line);max-width:100%}
.dot.ok{background:var(--ok)} .dot.fix{background:var(--bad)} .dot.now{background:var(--accent);transform:scale(1.25)}
.card{background:var(--card);border-radius:22px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;
  border:2px solid var(--line);transition:background .2s,border-color .2s}
.card.ok{background:var(--ok-soft);border-color:var(--ok)}
.card.bad{background:var(--bad-soft);border-color:var(--bad)}
.num{font-size:.85rem;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.eq{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,13vw,3.6rem);display:flex;align-items:center;gap:.25em;font-variant-numeric:tabular-nums;line-height:1}
.box{min-width:1.9em;height:1.35em;border:4px solid var(--fg);border-radius:14px;display:flex;align-items:center;justify-content:center;padding:0 .15em;box-sizing:border-box}
.card.ok .box{border-color:var(--ok);color:var(--ok)}
.card.bad .box{border-color:var(--bad);color:var(--bad)}
.box:empty::after{content:"?";color:var(--line)}
.msg{min-height:1.4em;font-weight:800;text-align:center}
.card.ok .msg{color:var(--ok)} .card.bad .msg{color:var(--bad)}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{font-family:var(--display);font-weight:800;font-size:1.7rem;padding:12px 0;border:0;border-radius:16px;background:var(--key);color:var(--key-fg);cursor:pointer}
.pad button:active{transform:scale(.96)}
.pad button:focus-visible,.again:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pad .go{background:var(--accent);color:#fff}
.pad .del{font-size:1.2rem}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-weight:700;font-size:.9rem}
.again{border:2px solid var(--line);background:transparent;color:var(--fg);font:inherit;font-weight:800;padding:8px 14px;border-radius:12px;cursor:pointer}
.done{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.done .big{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--ok);line-height:1}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
.cheer-wrap{position:fixed;inset:0;z-index:24;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(10,14,30,.55);animation:cw 2s forwards;cursor:pointer}
.cheer{background:var(--card);border:3px solid var(--accent);border-radius:26px;padding:26px 30px;text-align:center;
  max-width:320px;width:100%;box-sizing:border-box;box-shadow:0 18px 50px rgba(0,0,0,.3);animation:pop 2s forwards}
.cheer .t{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,11vw,3rem);color:var(--accent);line-height:1.1}
.cheer .s{font-weight:800;color:var(--muted);margin-top:6px;font-size:1.05rem}
@keyframes cw{0%{opacity:0}10%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes pop{0%{transform:scale(.6)}12%{transform:scale(1.06)}20%{transform:scale(1)}100%{transform:scale(1)}}
.puke{width:100%;max-width:300px;height:auto}
.puke .stream{stroke-dasharray:14 10;animation:flow .5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.puke .head{transform-origin:110px 120px;animation:heave .5s ease-in-out infinite alternate}
@keyframes heave{to{transform:rotate(6deg) translateY(3px)}}
.puke .drop{animation:fall 1s linear infinite}
.puke .drop:nth-of-type(2){animation-delay:.33s}.puke .drop:nth-of-type(3){animation-delay:.66s}
@keyframes fall{0%{transform:translateY(-30px);opacity:0}30%{opacity:1}100%{transform:translateY(40px);opacity:0}}
.puke .pool{transform-origin:240px 250px;animation:grow 3s ease-out forwards}
@keyframes grow{from{transform:scale(.2)}to{transform:scale(1)}}
.puke-title{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,12vw,3.4rem);color:var(--ok);line-height:1;transform:rotate(-4deg)}
.ask{position:fixed;inset:0;z-index:30;background:rgba(10,14,30,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.ask-box{background:var(--card);color:var(--fg);border-radius:22px;padding:22px 18px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;border:2px solid var(--line)}
.ask-box h2{font-family:var(--display);font-weight:800;font-size:1.4rem;margin:0}
.ask-box p{margin:0;color:var(--muted);font-weight:700}
.ask-btns{display:flex;gap:10px}
.ask-btns button{flex:1;font:inherit;font-weight:800;padding:12px;border-radius:14px;cursor:pointer;border:2px solid var(--line);background:transparent;color:var(--fg)}
.ask-btns .yes{background:var(--accent);border-color:var(--accent);color:#fff}
.ask-btns .yes.warn{background:var(--bad);border-color:var(--bad)}
.ask-sub{font-weight:800}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opts button{font-family:var(--display);font-weight:800;font-size:1.3rem;padding:10px 0;border-radius:14px;border:2px solid var(--line);background:var(--key);color:var(--key-fg);cursor:pointer}
.opts button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.opts button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ask-box input{font:inherit;font-weight:800;font-size:1.1rem;text-align:center;padding:10px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--fg);user-select:text;width:100%;box-sizing:border-box}
.ask-box input:focus{outline:none;border-color:var(--accent)}
.ask-box{max-height:calc(100vh - 40px);overflow-y:auto;gap:10px}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ops button{min-width:0;font-size:.85rem;padding:8px 4px;gap:2px;flex-direction:column;justify-content:center;text-align:center}.ops button b{font-size:1.4rem}
.count{white-space:nowrap}
.ask-box{box-sizing:border-box}
.ops button,.tens{font:inherit;font-weight:800;font-size:.95rem;padding:10px 8px;border-radius:14px;border:2px solid var(--line);background:var(--key);color:var(--key-fg);cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left}
.ops button b,.tens b{font-family:var(--display);font-size:1.6rem;line-height:1;min-width:1.2em;text-align:center}
.ops button.sel,.tens.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.tens{width:100%}.tens b{font-size:1.3rem}
.tens small{display:block;font-weight:700;font-size:.78rem;opacity:.8}
.ops button:focus-visible,.tens:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.abr{display:grid;grid-template-columns:auto auto 1fr auto 1fr;gap:6px 6px;align-items:center;margin-top:8px}
.abr[hidden]{display:none}
.abr>b{font-family:var(--display);font-size:1.4rem;color:var(--accent);min-width:1em}
.abr span{font-weight:800;color:var(--muted);font-size:.85rem}
.abr input{padding:8px 4px;font-size:1rem}
.tens small.exl{display:grid;grid-template-columns:auto auto;gap:0 16px;font-family:var(--display);font-size:.9rem;line-height:1.35;margin-top:2px}.tens small.exl i{font-style:normal;white-space:nowrap}
.abhint{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;text-align:center}.abhint .np{grid-column:1/-1}
.abnote{grid-column:1/-1;font-weight:700;color:var(--muted);font-size:.78rem;margin-top:-2px}
.abhint{grid-column:1/-1;font-weight:800;color:var(--muted);font-size:.85rem;min-height:1.2em}
#msec{display:flex;flex-direction:column;gap:10px}#msec[hidden]{display:none}
.pad .go.wide{grid-column:1/-1}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font:inherit;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:var(--key);color:var(--key-fg);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.seg button b{font-weight:800;font-size:.9rem}.seg button small{font-weight:700;font-size:.8rem;opacity:.8}
.seg button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#divsec{display:flex;flex-direction:column;gap:8px}#divsec[hidden]{display:none}
.seg.seg3{grid-template-columns:repeat(3,1fr)}.seg3 button b{font-size:1.4rem;line-height:1.1}
#menu .tens{position:relative;padding-right:60px}
#menu .tens::after{content:"";position:absolute;right:12px;top:50%;width:38px;height:22px;margin-top:-11px;border-radius:999px;background:var(--line)}
#menu .tens::before{content:"";position:absolute;right:30px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff;z-index:1;transition:right .15s}
#menu .tens.sel::after{background:rgba(255,255,255,.4)}
#menu .tens.sel::before{right:15px}
.hint-btn{font:inherit;font-weight:800;font-size:.9rem;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--accent);cursor:pointer}
.hint-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-weight:700;font-size:.9rem;line-height:1.35;text-align:center;background:var(--key);color:var(--key-fg);border-radius:14px;padding:8px 12px;width:100%;box-sizing:border-box}
.hq{display:inline-block;margin-top:2px;font-family:var(--display);font-size:1.25rem;font-weight:800;color:var(--accent)}
.live{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.95rem;padding:5px 12px 5px 6px;border-radius:999px;background:var(--card);border:2px solid var(--line)}
.chip .cb{min-width:30px;height:30px;padding:0 4px;box-sizing:border-box;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.05rem;color:#fff;background:var(--gc,var(--muted))}
.chip small{font-weight:700;color:var(--muted)}
.ask-err{color:var(--bad);font-weight:800;min-height:1.2em;font-size:.9rem}
.ask-btns button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grade{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px}
.grade .g{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:3.6rem;line-height:1;color:#fff;background:var(--gc)}
.grade .gn{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--gc);line-height:1.1}
.grade .gp{font-weight:800;color:var(--muted)}
.scale{width:100%;max-width:280px;border-collapse:collapse;font-size:.9rem;font-weight:700;margin-top:6px}
.scale td{padding:4px 8px;border-top:1px solid var(--line);color:var(--muted)}
.scale td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.scale tr.me td{color:var(--fg);font-weight:800;background:var(--key)}
.ghead{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,8.5vw,2.4rem);line-height:1.1;text-align:center}
.fb{width:100%;max-width:320px;height:auto;border-radius:16px;display:block}
.fb .ball{transform:translate(150px,215px) scale(1.3)}
.fb .spin{animation:spin .5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fb .net{transform-origin:150px 110px}
/* 4: słupek */
.fb4 .ball{animation:b4 2.8s ease-in infinite both}
@keyframes b4{0%{transform:translate(150px,215px) scale(1.3);opacity:1}
  45%{transform:translate(229px,108px) scale(.72)}
  47%{transform:translate(228px,110px) scale(.72);animation-timing-function:ease-out}
  80%{transform:translate(296px,160px) scale(.8);opacity:1}
  86%,100%{transform:translate(310px,170px) scale(.8);opacity:0}}
.fb4 .post-r{transform-origin:242px 170px;animation:wob 2.8s infinite}
@keyframes wob{0%,44%,62%,100%{transform:none}48%{transform:rotate(2deg)}52%{transform:rotate(-1.5deg)}56%{transform:rotate(1deg)}}
.fb4 .bang{opacity:0;animation:bang 2.8s infinite}
@keyframes bang{0%,44%{opacity:0;transform:none}48%{opacity:1;transform:translateY(-4px)}70%{opacity:1}80%,100%{opacity:0}}
/* 5: gol */
.fb5 .ball{animation:b5 2.8s ease-out infinite both}
@keyframes b5{0%{transform:translate(150px,215px) scale(1.3);opacity:1}
  45%{transform:translate(170px,118px) scale(.66)}
  55%{transform:translate(172px,130px) scale(.6)}
  65%,88%{transform:translate(170px,158px) scale(.6);opacity:1}
  96%,100%{transform:translate(170px,158px) scale(.6);opacity:0}}
.fb5 .net{animation:bulge 2.8s infinite}
@keyframes bulge{0%,44%,70%,100%{transform:none}50%{transform:scale(.95)}58%{transform:scale(1.02)}}
.fb5 .gol{transform-origin:150px 30px;opacity:0;animation:gol5 2.8s infinite}
@keyframes gol5{0%,48%{opacity:0;transform:scale(.4)}56%{opacity:1;transform:scale(1.15)}62%,88%{opacity:1;transform:scale(1)}96%,100%{opacity:0}}
/* 6: okienko, odtwarzane raz */
.video{position:relative;width:100%;max-width:320px;border-radius:18px;overflow:hidden;border:4px solid #1d2540;background:#1d2540}
.video .fb{border-radius:0}
.rec{position:absolute;top:8px;left:10px;z-index:1;color:#fff;font-weight:800;font-size:.75rem;letter-spacing:.06em;background:rgba(0,0,0,.45);padding:3px 8px;border-radius:8px}
.replay{margin-top:-2px}
@media (prefers-reduced-motion:reduce){.shake,.cheer,.puke *{animation:none!important}.card{transition:none}
  .fb *{animation-duration:.01s!important;animation-iteration-count:1!important;animation-delay:0s!important}}
</style>
<script>/* motyw z ustawień przed narysowaniem strony, bez mignięcia */

<canvas id="fw"></canvas>

<div class="wrap">
  <header><h1 id="title">Mnożenie do 100</h1><div class="right"><span class="count" id="count">1 / 100</span>
    <button type="button" class="menu-btn" id="menu-btn" aria-label="Ustawienia" aria-haspopup="dialog"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button></div></header>
  <div class="dots" id="dots"></div>
  <div class="live" id="live" hidden><span class="chip" id="live-pct"></span><span class="chip" id="live-g"></span></div>
  <div class="card" id="card">
    <div class="num" id="num">Działanie 1</div>
    <div class="eq"><span id="a">3</span><span id="op">×</span><span id="b">4</span><span>=</span><span class="box" id="box"></span></div>
    <div class="msg" id="msg">Wpisz wynik i naciśnij OK</div>
    <div class="hint" id="hint" hidden aria-live="polite"></div>
    <button type="button" class="hint-btn" id="hint-btn">💡 Podpowiedź</button>
  </div>
  <div class="pad" id="pad"></div>
  <div class="foot"><span id="stats">Błędy: 0</span><button class="again" id="again" type="button">Nowe działania</button></div>
</div>

<div class="ask" id="ask" hidden role="dialog" aria-modal="true" aria-labelledby="ask-t">
  <div class="ask-box">
    <h2 id="ask-t">Nowa sesja</h2>
    <p id="ask-warn">Na pewno? Obecny postęp zostanie skasowany.</p>
    <div class="ask-sub">Jakie działania?</div>
    <div class="ops" id="ops">
      <button type="button" data-op="+"><b>+</b>Dodawanie</button><button type="button" data-op="−"><b>−</b>Odejmowanie</button>
      <button type="button" data-op="×"><b>×</b>Mnożenie</button><button type="button" data-op=":"><b>:</b>Dzielenie</button>
    </div>
    <div id="divsec">
      <div class="ask-sub">Jakie dzielenie?</div>
      <div class="seg" id="divmode">
        <button type="button" data-d="tab"><b>Odwrotność tabliczki</b><small>np. 56 : 7 = 8</small></button>
        <button type="button" data-d="any"><b>Dowolne</b><small>np. 390 : 5 = 78</small></button>
      </div>
    </div>
    <button type="button" class="tens" id="tens" aria-pressed="false"><b>10</b><span>Wielokrotności 10<small>tylko pełne dziesiątki: 20, 30, 40…</small></span></button>
    <button type="button" class="tens" id="frac" aria-pressed="false"><b>½</b><span>Dzielenie z ułamkami<small>wynik z przecinkiem, np. 7 : 2 = 3,5</small></span></button>
    <div id="absec">
      <button type="button" class="tens" id="abon" aria-pressed="false"><span>Zakres a, b, wynik c<small class="exl"><i>a + b = c</i><i>a − b = c</i><i>a × b = c</i><i>a : b = c</i></small></span></button>
      <div class="abr" id="abr" hidden>
        <b>a</b><span>od</span><input id="a-lo" type="number" inputmode="numeric" min="1" max="10000" aria-label="a od"><span>do</span><input id="a-hi" type="number" inputmode="numeric" min="1" max="10000" aria-label="a do">

        <b>c</b><span>od</span><input id="c-lo" type="number" inputmode="numeric" min="0" max="1000000" placeholder="—" aria-label="wynik od"><span>do</span><input id="c-hi" type="number" inputmode="numeric" min="0" max="1000000" placeholder="—" aria-label="wynik do">

    <input id="ask-n" type="number" inputmode="numeric" min="5" max="200" placeholder="albo wpisz: 5–200" aria-label="Liczba działań">

<div class="ask" id="menu" hidden role="dialog" aria-modal="true" aria-labelledby="menu-t">
  <div class="ask-box">
    <h2 id="menu-t">Ustawienia</h2>
    <div class="ask-sub">Wygląd</div>

    <div class="ask-btns"><button type="button" class="yes" id="menu-ok">Gotowe</button></div>

<script>
let N=100;
let CFG={cr:[null,null],m:100,ops:["×"],tens:false,frac:false,div:"tab",ab:false,ar:[2,10],br:[2,10]};
let ALEN=3;
let tasks=[],i=0,input="",errors=0,state=[],locked=false;
const $=id=>document.getElementById(id);
/* ustawienia z menu ☰ (wczytane przed pierwszym show) */
const PKEY="henriksen-ustawienia";
let PREFS={theme:"auto",awake:true,dots:true,pct:false,grade:false,hints:true};
try{const p=JSON.parse(localStorage.getItem(PKEY));if(p) PREFS={theme:["light","dark"].includes(p.theme)?p.theme:"auto",awake:p.awake!==false,dots:p.dots!==false,pct:!!p.pct,grade:!!p.grade,hints:p.hints!==false};}catch(e){}
/* bez zaznaczania i menu po przytrzymaniu (poza polami do wpisywania) */
["contextmenu","selectstart"].forEach(ev=>document.addEventListener(ev,e=>{if(!e.target.closest||!e.target.closest("input")) e.preventDefault();}));
const KEY="tabliczka100-postep";
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({n:N,cfg:CFG,tasks,i,errors,state}));}catch(e){}
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    const n=d&&Number.isInteger(d.n)?d.n:100;
    if(d&&Array.isArray(d.tasks)&&d.tasks.length===n&&Array.isArray(d.state)&&d.state.length===n&&Number.isInteger(d.i)&&d.i>=0&&d.i<=n){
      N=n;tasks=d.tasks.map(t=>t.length===2?[t[0],"×",t[1]]:t);
      if(d.cfg&&Array.isArray(d.cfg.ops)&&d.cfg.ops.length&&d.cfg.m>=10) CFG={m:+d.cfg.m,ops:d.cfg.ops,tens:!!d.cfg.tens,frac:!!d.cfg.frac,div:d.cfg.div==="any"?"any":"tab",ab:!!d.cfg.ab,ar:d.cfg.ar||[2,10],br:d.cfg.br||[2,10],cr:d.cfg.cr||[null,null]};i=d.i;errors=+d.errors||0;state=d.state;return true;
    }
  }catch(e){}
  return false;
}

/* Generator działań: zakres M (wynik / dzielna ≤ M), opcjonalnie tylko pełne dziesiątki */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function multPair(M,tens){
  if(!tens){
    if(M<=100){const a=rnd(2,Math.min(10,Math.floor(M/2)));const bm=Math.min(10,Math.floor(M/a));if(bm<2) return null;return [a,rnd(2,bm)];}
    const a=rnd(2,10),bm=Math.min(Math.floor(M/a),Math.max(10,Math.floor(M/10)));if(bm<2) return null;return [a,rnd(2,bm)];
  }
  // jeden czynnik to pełne dziesiątki; przy większym zakresie czasem oba
  const a=(M>=400&&Math.random()<.35)?10*rnd(2,Math.max(2,Math.floor(M/200))):rnd(2,9);
  const km=Math.floor(M/(a*10));if(km<1) return null;
  return [a,10*rnd(1,Math.min(km,99))];
}
function pickIn(lo,hi,tens){
  if(tens){const l=Math.ceil(lo/10),h=Math.floor(hi/10);if(l<=h&&h>0) return 10*rnd(Math.max(l,1),h);}
  return rnd(lo,hi);
}
const crOf=cfg=>[cfg&&cfg.cr&&cfg.cr[0]!=null?cfg.cr[0]:0,cfg&&cfg.cr&&cfg.cr[1]!=null?cfg.cr[1]:1e12];
function fracDiv(alo,ahi,blo,bhi,tens,cr){
  // dzielenie z wynikiem niecałkowitym, najwyżej 2 miejsca po przecinku
  cr=cr||[0,1e12];
  for(let k=0;k<200;k++){
    const b=rnd(Math.max(2,blo),bhi),a=pickIn(Math.max(alo,1),ahi,tens);
    if(a%b&&(a*100)%b===0&&a/b>=cr[0]&&a/b<=cr[1]) return [a,":",b];
  }
  return null;
}
function tabDiv(M,tens){
  // odwrotność tabliczki: (x·y) : x = y, x i y z tabliczki do 100; z dziesiątkami jeden czynnik ×10
  const lim=tens?Math.min(M,1000):Math.min(M,100);
  for(let k=0;k<60;k++){
    const x=rnd(2,10),y=tens?10*rnd(1,10):rnd(2,10),c=x*y;
    if(c>lim) continue;
    return Math.random()<.5?[c,":",x]:[c,":",y];
  }
  return null;
}
function makeTask(op,M,tens,cfg){
  const s=tens?10:1;
  if(op===":"&&(!cfg||cfg.div!=="any")) return tabDiv(M,tens);
  if(op===":"&&cfg&&cfg.frac&&cfg.div==="any"&&Math.random()<.5){
    const f=cfg.ab?fracDiv(cfg.ar[0],cfg.ar[1],cfg.br[0],cfg.br[1],tens,crOf(cfg)):fracDiv(3,M,2,M>1000?20:10,tens);
    if(f) return f;
  }
  if(cfg&&cfg.ab&&(op!==":"||cfg.div==="any")){
    const [clo,chi]=crOf(cfg);
    if(op==="+"||op==="−"){
      for(let k=0;k<80;k++){
        const a=pickIn(cfg.ar[0],cfg.ar[1],tens);
        const blo=op==="+"?Math.max(cfg.br[0],clo-a):Math.max(cfg.br[0],a-chi);
        const bhi=op==="+"?Math.min(cfg.br[1],chi-a):Math.min(cfg.br[1],a-Math.max(clo,0));
        if(blo>bhi) continue;
        const b=pickIn(blo,bhi,tens);if(tens&&b%10) continue;
        return [a,op,b];
      }
      return null;
    }
    if(op==="×"){
      for(let k=0;k<60;k++){
        const a=pickIn(cfg.ar[0],cfg.ar[1],tens);
        const blo=Math.max(cfg.br[0],Math.ceil(clo/a)),bhi=Math.min(cfg.br[1],Math.floor(chi/a));
        if(blo<=bhi) return [a,"×",rnd(blo,bhi)];
      }
      return null;
    }
    // dzielenie: a = dzielna z zakresu a, b = dzielnik z zakresu b, wynik całkowity c z zakresu c
    for(let k=0;k<80;k++){
      const b=rnd(cfg.br[0],cfg.br[1]),qlo=Math.max(1,clo,Math.ceil(cfg.ar[0]/b)),qhi=Math.min(chi,Math.floor(cfg.ar[1]/b));
      if(qlo>qhi) continue;
      const a=b*rnd(qlo,qhi);if(tens&&a%10) continue;
      return [a,":",b];
    }
    return null;
  }
  if(op==="+"){const top=Math.floor(M/s);if(top<2) return null;const c=s*rnd(2,top),a=s*rnd(1,c/s-1);return [a,"+",c-a];}
  if(op==="−"){const top=Math.floor(M/s);if(top<2) return null;const a=s*rnd(2,top),b=s*rnd(1,a/s-1);return [a,"−",b];}
  const p=multPair(M,tens);if(!p) return null;
  let [a,b]=p;if(Math.random()<.5) [a,b]=[b,a];
  if(op==="×") return [a,"×",b];
  return [a*b,":",b];
}
function answer(t){const [a,op,b]=t;return op==="+"?a+b:op==="−"?a-b:op==="×"?a*b:a/b;}
const fmt=n=>String(Math.round(n*100)/100).replace(".",",");
function canMake(cfg){return cfg.ops.every(op=>{for(let k=0;k<60;k++) if(makeTask(op,cfg.m,cfg.tens,cfg)) return true;return false;});}
function gen(){
  const t=[];let prev="",guard=0;
  while(t.length<N&&guard++<N*400){
    const op=CFG.ops[rnd(0,CFG.ops.length-1)];
    const x=makeTask(op,CFG.m,CFG.tens,CFG);if(!x) continue;
    const k=x.join(" ");if(k===prev) continue;prev=k;t.push(x);
  }
  while(t.length<N) t.push([2,"×",2]);
  return t;
}
const OPNAME={"+":"Dodawanie","−":"Odejmowanie","×":"Mnożenie",":":"Dzielenie"};
function title(){
  ALEN=Math.max(1,...tasks.map(t=>fmt(answer(t)).length));
  buildPad();
  const o=["+","−","×",":"].filter(x=>CFG.ops.includes(x));
  let t=o.length===1?OPNAME[o[0]]:o.length===2?OPNAME[o[0]]+" i "+OPNAME[o[1]].toLowerCase():"Działania";
  const tab=o.includes(":")&&CFG.div!=="any";
  const ab=CFG.ab&&o.some(x=>x!==":"||!tab), pm=tab||!CFG.ab;
  if(!ab||pm) t+=" do "+CFG.m;
  if(tab) t+=" · odwrotność tabliczki";
  if(ab){t+=" · a "+CFG.ar.join("–")+", b "+CFG.br.join("–");
    const [clo,chi]=CFG.cr||[null,null];
    if(clo!=null||chi!=null) t+=", wynik "+(clo!=null&&chi!=null?clo+"–"+chi:chi!=null?"do "+chi:"od "+clo);}
  if(CFG.tens) t+=" · dziesiątki";
  if(CFG.frac&&o.includes(":")&&!tab) t+=" · ułamki";
  $("title").textContent=t;document.title="Henriksen · "+t;
}
function fitEq(){
  const eq=document.querySelector(".eq"),card=$("card"),max=card.clientWidth-28;
  $("box").style.minWidth=Math.max(1.9,ALEN*.62+.5)+"em";
  let fs=58;eq.style.fontSize=fs+"px";
  while(fs>20&&eq.getBoundingClientRect().width>max){fs-=2;eq.style.fontSize=fs+"px";}
}

function start(n){
  if(n) N=n;
  tasks=gen();i=0;input="";errors=0;state=Array(N).fill("");locked=false;
  save();
  render();
}
function render(){
  title();
  $("dots").innerHTML=Array.from({length:N},()=>'<span class="dot"></span>').join("");
  $("card").hidden=false;$("pad").hidden=false;
  const d=document.querySelector(".done"); if(d) d.remove();
  show();
}
function show(){
  const [a,op,b]=tasks[i];
  $("a").textContent=a;$("op").textContent=op;$("b").textContent=b;$("box").textContent=input;
  fitEq();
  $("num").textContent="Działanie "+(i+1);$("count").textContent=(i+1)+" / "+N;
  $("stats").textContent="Błędy: "+errors;
  const dots=$("dots").children;
  for(let k=0;k<N;k++) dots[k].className="dot"+(state[k]?" "+state[k]:"")+(k===i?" now":"");
  resetHint();updateLive();
}
/* Podpowiedzi: kolejne kroki, każdy kolejny mówi trochę więcej */
const NAZWY={2:"dwójek",3:"trójek",4:"czwórek",5:"piątek",6:"szóstek",7:"siódemek",8:"ósemek",9:"dziewiątek",10:"dziesiątek"};
const ileRazy=b=>NAZWY[b]?"ile "+NAZWY[b]:"ile razy "+b;
const dzies=n=>{const j=n%10,d=n%100;return n+(n===1?" dziesiątka":j>=2&&j<=4&&!(d>=12&&d<=14)?" dziesiątki":" dziesiątek");};
function hints(t){
  const [a,op,b]=t, Q=s=>`<span class="hq">${s}</span>`;
  if(op===":"){
    const s=[`Dzielenie to odwrotność mnożenia. ${a} : ${b} pyta: <b>${ileRazy(b)}</b> potrzebujesz, żeby dostać ${a}?<br>${Q(`${b} × ? = ${a}`)}`];
    if(a%b){const q=Math.floor(a/b),r=a-b*q;
      s[0]+="<br>Tu nie wyjdzie równo, wynik będzie z przecinkiem.";
      s.push(`${b} × ${q} = ${b*q}, zostaje ${r}. Ile to ${r} : ${b}? Np. 1 : 2 = 0,5, 1 : 4 = 0,25.`);
    }else{const q=a/b;
      if(q<=12) s.push(`Licz co ${b}: ${Array.from({length:q},(_,k)=>b*(k+1)).join(", ")}. Ile liczb wyszło?`);
      else{const qt=Math.floor(q/10)*10,qu=q-qt;
        s.push(qu?`Rozbij ${a} na ${b*qt} + ${b*qu}. ${ileRazy(b)[0].toUpperCase()+ileRazy(b).slice(1)} jest w ${b*qt}, a ${ileRazy(b)} w ${b*qu}? Dodaj oba wyniki.`
          :`${b} × 10 = ${b*10}. Ile razy ${b*10} mieści się w ${a}? Ten wynik pomnóż przez 10.`);}
    }
    return s;
  }
  if(op==="×"){
    const s=Math.min(a,b),L=Math.max(a,b);
    const out=[`Mnożenie to dodawanie tej samej liczby. ${a} × ${b} to ${s} razy po ${L}.`];
    if(L%10===0&&L>10) out.push(`${L} to ${dzies(L/10)}. Policz ${s} × ${L/10} i dopisz 0.`);
    else if(L>10){const T=Math.floor(L/10)*10;out.push(`Rozbij ${L} na ${T} + ${L-T}:<br>${Q(`${s} × ${T} + ${s} × ${L-T}`)}`);}
    else if(s<=5) out.push(Q(Array(s).fill(L).join(" + ")));
    else out.push(`5 × ${L} = ${5*L}. Dodaj jeszcze ${s-5} × ${L}.`);
    return out;
  }
  if(op==="+"){
    const x=Math.max(a,b),y=Math.min(a,b),first=a<b?`Łatwiej zacząć od większej liczby: ${x} + ${y}. `:"";
    if(y>=10){const T=Math.floor(y/10)*10,U=y-T;
      return U?[`${first}Rozbij ${y} na dziesiątki i jedności: ${T} i ${U}.`,`${x} + ${T} = ${x+T}. Teraz ${Q(`${x+T} + ${U}`)}`]
        :[`${first}${y} to ${dzies(T/10)}. Dodaj je do ${x}.`];}
    const d=10-x%10;
    if(x%10&&y>d) return [`${first}Dopełnij ${x} do pełnej dziesiątki: ile brakuje do ${x+d}?`,`${x} + ${d} = ${x+d}, zostaje jeszcze ${y-d}.<br>${Q(`${x+d} + ${y-d}`)}`];
    return [`${first}Policz dalej od ${x}, o ${y}.`];
  }
  // odejmowanie
  // małe b: od razu konkretny krok; większe: najpierw "odwrotność dodawania"
  if(b<10){
    if(a>=10&&b>a%10&&a%10) return [`Zejdź do pełnej dziesiątki: ${a} − ${a%10} = ${a-a%10}. Zostaje odjąć ${b-a%10}.<br>${Q(`${a-a%10} − ${b-a%10}`)}`];
    return [`Licz w dół od ${a}, o ${b}.`];
  }
  const T=Math.floor(b/10)*10,U=b-T;
  return [`Odejmowanie to odwrotność dodawania. Ile trzeba dodać do ${b}, żeby dostać ${a}?<br>${Q(`${b} + ? = ${a}`)}`,
    U?`${a} − ${T} = ${a-T}. Teraz ${Q(`${a-T} − ${U}`)}`:`${b} to ${dzies(T/10)}. Odejmij je od ${a}.`];
}
let hintStep=0;
function resetHint(){hintStep=0;$("hint").hidden=true;$("hint").innerHTML="";$("hint-btn").hidden=!PREFS.hints;$("hint-btn").textContent="💡 Podpowiedź";}
function nextHint(){
  if(i>=N) return;
  const h=hints(tasks[i]);hintStep=Math.min(hintStep+1,h.length);
  // tylko ostatni krok (każdy ma sens sam), bez łamania linii w środku działania
  $("hint").innerHTML=h[hintStep-1].replace(/ ([:×+−=]) /g," $1 ");$("hint").hidden=false;
  if(hintStep>=h.length) $("hint-btn").hidden=true; else $("hint-btn").textContent="💡 Jeszcze podpowiedź";
}
/* procent i ocena na bieżąco: z działań już skończonych (0…i-1) */
function updateLive(){
  const on=(PREFS.pct||PREFS.grade)&&i<N;$("live").hidden=!on;if(!on) return;
  const good=state.slice(0,i).filter(s=>s==="ok").length, pct=i?Math.floor(good*100/i):null, g=i?grade(pct):null;
  $("live-pct").hidden=!PREFS.pct;
  $("live-pct").innerHTML=`<span class="cb">${i?pct+"%":"–"}</span>dobrze <small>${good} / ${i}</small>`;
  $("live-g").hidden=!PREFS.grade;
  $("live-g").style.setProperty("--gc",g?g.c:"");
  $("live-g").innerHTML=`<span class="cb">${g?g.n:"–"}</span>${g?g.name:"ocena po 1. działaniu"}`;
}
function press(v){
  if(locked||document.querySelector(".cheer-wrap")) return;
  const card=$("card");
  if(card.classList.contains("bad")){card.classList.remove("bad");$("msg").textContent="Spróbuj jeszcze raz";}
  if(v==="del"){input=input.slice(0,-1);}
  else if(v==="ok"){check();return;}
  else if(v===","){if(!input.includes(",")&&input.length<ALEN-1) input=(input||"0")+",";}
  else if(input.length<ALEN&&!(input.includes(",")&&input.split(",")[1].length>=2)){input=(input==="0"?"":input)+v;}
  $("box").textContent=input;
}
function check(){
  if(!input) return;
  const card=$("card");
  if(Math.abs(+input.replace(",",".")-answer(tasks[i]))<1e-9&&!input.endsWith(",")){
    card.classList.add("ok");$("msg").textContent="Dobrze!";
    if(!state[i]) state[i]="ok";
    save();
    locked=true;
    if((i+1)%5===0&&i+1<N) celebrate(i+1);
    setTimeout(()=>{card.classList.remove("ok");locked=false;input="";i++;save();
      if(i>=N) finish(); else {$("msg").textContent="Wpisz wynik i naciśnij OK";show();}},650);
  }else{
    errors++;state[i]="fix";save();
    card.classList.add("bad");$("msg").textContent="Źle, popraw wynik";
    card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");
    input="";$("box").textContent="";$("stats").textContent="Błędy: "+errors;
    $("dots").children[i].className="dot fix now";
  }
}
function finish(quiet){
  $("card").hidden=true;$("pad").hidden=true;$("live").hidden=true;$("count").textContent=N+" / "+N;
  const dots=$("dots").children;for(let k=0;k<N;k++) dots[k].className="dot "+state[k];
  const good=state.filter(s=>s==="ok").length;
  const pct=Math.floor(good*100/N), g=grade(pct);
  const d=document.createElement("div");d.className="done card";
  d.innerHTML=`${art(g)}<div>${N===1?"Działanie zrobione.":"Wszystkie "+N+" "+dzialan(N)+" zrobione."}</div>
  <div class="grade" style="--gc:${g.c}"><div class="g" aria-hidden="true">${g.n}</div><div class="gn">Ocena: ${g.n} – ${g.name}</div>
  <div class="gp">Za pierwszym razem dobrze: ${good} / ${N} (${pct}%)</div></div>
  <table class="scale" aria-label="Skala ocen">${GRADES.map(x=>`<tr class="${x.n===g.n?"me":""}"><td>${x.n} – ${x.name}</td><td>${x.label}</td></tr>`).join("")}</table>`;
  $("dots").after(d);
  const v6=d.querySelector(".fb6");

  if(!pops.length){$("ask-err").textContent="Wybierz przynajmniej jedno działanie";return;}
  let ab={ar:CFG.ar,br:CFG.br,cr:CFG.cr||[null,null]};
  const useAB=pab&&pops.some(x=>x!==":"||pdiv==="any");
  if(useAB){ab=readAB();if(typeof ab==="string"){$("ask-err").textContent=ab;return;}}
  const cfg={m,ops:[...pops],tens:ptens,frac:pfrac&&pops.includes(":")&&pdiv==="any",div:pdiv,ab:useAB,ar:ab.ar,br:ab.br,cr:ab.cr};
  if(!canMake(cfg)){$("ask-err").textContent=cfg.ab?"Przy tych zakresach a, b i c nie da się ułożyć działania – zmień zakresy":ptens?"Za mały zakres na pełne dziesiątki – wybierz większy":"Za mały zakres dla wybranych działań";return;}
  CFG=cfg;$("ask").hidden=true;start(n);
}

$("ask-n").addEventListener("input",()=>{$("ask-err").textContent="";selOpt();});
$("ask-n").addEventListener("keydown",e=>{if(e.key==="Enter") confirmAsk();});
$("ask-m").addEventListener("keydown",e=>{if(e.key==="Enter") confirmAsk();});
$("ask-m").addEventListener("input",()=>{$("ask-err").textContent="";selOpt();});
$("ranges").addEventListener("click",e=>{const b=e.target.closest("button");if(!b) return;pm=+b.dataset.m;$("ask-m").value="";$("ask-err").textContent="";selOpt();});
$("ops").addEventListener("click",e=>{const b=e.target.closest("button");if(!b) return;const o=b.dataset.op;
  pops=pops.includes(o)?pops.filter(x=>x!==o):[...pops,o];$("ask-err").textContent="";selOpt();});
$("tens").addEventListener("click",()=>{ptens=!ptens;$("ask-err").textContent="";selOpt();});
$("abon").addEventListener("click",()=>{pab=!pab;$("ask-err").textContent="";selOpt();});
$("divmode").addEventListener("click",e=>{const b=e.target.closest("button");if(!b) return;pdiv=b.dataset.d;$("ask-err").textContent="";selOpt();});
$("frac").addEventListener("click",()=>{pfrac=!pfrac;$("ask-err").textContent="";selOpt();});
["a-lo","a-hi","b-lo","b-hi","c-lo","c-hi"].forEach(id=>{$(id).addEventListener("input",()=>{$("ask-err").textContent="";abHint();});
  $(id).addEventListener("keydown",e=>{if(e.key==="Enter") confirmAsk();});});
addEventListener("resize",()=>{if(!$("card").hidden&&i<N) fitEq();});
$("again").addEventListener("click",()=>openAsk(false));
$("ask-no").addEventListener("click",closeAsk);
$("ask").addEventListener("click",e=>{if(e.target.id==="ask") closeAsk();});
$("ask-yes").addEventListener("click",confirmAsk);
if(load()){
  if(i>=N){render0();finish(true);} else render0();
}else{tasks=gen();state=Array(N).fill("");render0();openAsk(true);}
function render0(){
  title();
  $("dots").innerHTML=Array.from({length:N},()=>'<span class="dot"></span>').join("");
  if(i<N) show();
}
/* Ustawienia (menu ☰): motyw i ekran bez wygaszania */
function savePrefs(){try{localStorage.setItem(PKEY,JSON.stringify(PREFS));}catch(e){}}
const TOGGLES=[["o-dots","dots"],["o-pct","pct"],["o-grade","grade"],["o-hints","hints"],["awake","awake"]];
function applyView(){$("dots").hidden=!PREFS.dots;updateLive();if(i<N) resetHint();}
$("hint-btn").addEventListener("click",nextHint);
function applyTheme(){
  if(PREFS.theme==="auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme=PREFS.theme;
}
function selMenu(){
  for(const b of $("theme").children) b.classList.toggle("sel",b.dataset.t===PREFS.theme);
  for(const [id,k] of TOGGLES){$(id).classList.toggle("sel",PREFS[k]);$(id).setAttribute("aria-pressed",PREFS[k]);}
  $("awake-s").textContent="wakeLock" in navigator?"gdy aplikacja jest otwarta":"ten telefon tego nie obsługuje";
}
function openMenu(){selMenu();$("menu").hidden=false;$("menu-ok").focus();}
function closeMenu(){$("menu").hidden=true;$("menu-btn").focus();}
$("menu-btn").addEventListener("click",openMenu);
$("menu-ok").addEventListener("click",closeMenu);
$("menu").addEventListener("click",e=>{if(e.target.id==="menu") closeMenu();});
$("theme").addEventListener("click",e=>{const b=e.target.closest("button");if(!b) return;PREFS.theme=b.dataset.t;savePrefs();applyTheme();selMenu();});
for(const [id,k] of TOGGLES) $(id).addEventListener("click",()=>{PREFS[k]=!PREFS[k];savePrefs();selMenu();
  if(k==="awake") PREFS.awake?wake():unwake(); else applyView();});
applyTheme();applyView();

/* Wake Lock: ekran nie gaśnie, póki aplikacja jest na wierzchu (system zwalnia blokadę po schowaniu) */
let wl=null;
async function wake(){
  if(!PREFS.awake||wl||!("wakeLock" in navigator)||document.visibilityState!=="visible") return;
  try{wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null;});}catch(e){wl=null;}
}
function unwake(){if(wl){wl.release().catch(()=>{});wl=null;}}
document.addEventListener("visibilitychange",wake);
document.addEventListener("pointerdown",wake); // Safari wymaga dotknięcia
wake();

/* PWA: działanie offline */
if("serviceWorker" in navigator&&location.protocol.startsWith("http")){
  addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
